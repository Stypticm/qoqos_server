server {
    listen 80;
    server_name localhost;

    # Прокси для API (Go-сервис)
    location /api/ {
        proxy_pass http://api:8080;  # запросы /api/... идут в Go-сервис
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Прокси для статики (если она отдаётся через Go-сервис)
    location /static/ {
        proxy_pass http://api:8080/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Все остальные запросы — в n8n
    location / {
       proxy_pass http://qoqos_n8n:5678/;
    proxy_http_version 1.1;                      # обязательно для WebSocket
    proxy_set_header Upgrade $http_upgrade;       # обязательно
    proxy_set_header Connection "upgrade";        # обязательно
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Увеличиваем таймауты для долгих соединений (рекомендуется)
    proxy_connect_timeout 3600;
    proxy_send_timeout 3600;
    proxy_read_timeout 3600;
    }
}