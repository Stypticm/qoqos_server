services:
  postgres:
    image: postgres:15
    container_name: qoqos_postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-qoqos}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: qoqos_redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api-service
      dockerfile: Dockerfile.dev
    container_name: qoqos_api
    restart: unless-stopped
    ports:
      - '8080:8080'
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-qoqos}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./api-service:/app
      - ./storage:/app/storage

  nginx:
    image: nginx:alpine
    container_name: qoqos_nginx
    restart: unless-stopped
    ports:
      - '8088:80'
      - '443:443'
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - api

  qdrant:
    image: qdrant/qdrant
    container_name: qoqos_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    container_name: qoqos_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_models:/root/.ollama

  ai-agent:
    build:
      context: ./ai-agent
      dockerfile: Dockerfile
    container_name: qoqos_ai_agent
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-qoqos}
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      OLLAMA_URL: http://ollama:11434/api/generate
      OLLAMA_EMBEDDING_URL: http://ollama:11434/api/embeddings
      OLLAMA_MODEL: qwen2:1.5b
      EMBEDDING_MODEL: nomic-embed-text
    volumes:
      - ./ai-agent:/app
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    command: uvicorn main:app --host 0.0.0.0 --port 8001

volumes:
  postgres_data:
  redis_data: